services:
  app:
    build:
      args:
        user: ignicion
        uid: 1000
      context: ./
      dockerfile: Dockerfile
    image: medusa
    container_name: medusa-app
    restart: unless-stopped
    working_dir: /var/www/
    ports:
      - 6001:6001
    volumes:
      - ./:/var/www
    networks:
      - medusa
    user: root

  nginx:
    image: nginx:alpine
    container_name: medusa-nginx
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./:/var/www
      - ./docker-compose/nginx:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt
    networks:
      - medusa

  certbot:
    image: certbot/certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./docker-compose/nginx:/etc/nginx/conf.d
      - ./docker-compose/webroot:/var/www/html
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx

  redis:
    container_name: redis
    image: redis:7.0
    expose:
      - 6379
    volumes:
      - redis-data:/data
    networks:
      - medusa
    
  postgres:
    image: postgres:14.2
    restart: always
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ignicion
      POSTGRES_PASSWORD: root
      POSTGRES_DB: medusa
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medusa

networks:
  medusa:
    driver: bridge

volumes:
  postgres_data:
  redis-data:
