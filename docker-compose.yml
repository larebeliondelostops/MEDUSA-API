version: "3.8"
services:
  app:
    build:
      args:
        user: ignicion
        uid: 1000
      context: ./
      dockerfile: Dockerfile
    image: medusa
    container_name: medusa-app
    restart: unless-stopped
    working_dir: /var/www/
    ports:
      - 6001:6001
    volumes:
      - ./:/var/www
    networks:
      - medusa
    user: root

  nginx:
    image: nginx:alpine
    container_name: medusa-nginx
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./:/var/www
      - ./docker-compose/nginx:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt
    networks:
      - medusa

networks:
  medusa:
    driver: bridge